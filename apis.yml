aid: lyten
name: Lyten
description: 'Lyten is a San Jose, California advanced-materials company founded in
  2015 that invented and commercializes Lyten 3D Graphene, a tunable three-dimensional
  carbon supermaterial produced by converting methane into nanostructured carbon while
  co-producing hydrogen. Lyten applies that materials platform across four product
  lines: lithium-sulfur battery cells and battery systems that contain no cobalt, nickel
  or manganese and target roughly 40% weight savings versus lithium-ion; 3D graphene
  reinforced 3D printer filament; concrete admixture and structural adhesives; and
  chemical/environmental sensors, including the Lyten Atmos continuous methane-intelligence
  platform that pairs solar-powered LTE field sensors with cloud analytics and dashboards
  for landfill and oil-and-gas emissions monitoring. The company has raised over $600
  million from investors including Stellantis, FedEx and Honeywell, operates a 145,000
  sq ft pilot manufacturing facility in the Alviso district of North San Jose, acquired
  Cuberg''s San Leandro battery assets in 2024, and in 2025 acquired Northvolt battery
  manufacturing assets in Poland and Sweden, establishing a European headquarters in
  Gdansk, Poland. Lyten is a private company; its shares trade on secondary markets
  such as Forge Global. It publishes no public developer API, SDK or developer portal.'
